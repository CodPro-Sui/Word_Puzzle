<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Game</title>
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
  <div class="main">
  <div class="aboutMe">
    <div><!-- empty div --></div>
    <h1 class="headerName">Word Guess</h1>
    <div id="identity"><span class="material-symbols-outlined">info</span></div>
  </div>
    <!-- scores -->
    <div class="scores">
      <div id="CScore">00</div>
      <div id="HScore">00</div>
    </div>
    
    <!-- letters logic -->
    <div class="letters">
      <span>Fill Letters:</span>
      <div id="fixLetters">
        
      </div>
    </div>
    
    <div class="letters">
      <span>Arrange Letters:</span>
      <div id="fillLetters">
        
      </div>
    </div>
    
    
    <!-- button -->
    <div class="handle">
      <button type="submit" id="next">Next</button>
      <button type="submit" id="check">Check</button>
    </div>
  </div>
  
<script src="script.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
